# Review-only M1-TST-01 evidence from unmodified develop production.
# Does NOT add required checks or change protection. Expected RED is intentionally visible.
name: M1 TST 01 unified fixtures evidence (non-gating)

on:
  push:
    branches:
      - feature/M1-TST-01-unified-ADM-M1-037
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-unified-instrumented:
    if: github.ref == 'refs/heads/feature/M1-TST-01-unified-ADM-M1-037'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
        suite: [fixture-loader, baseline-d01-red, v1-v10-upgrade, scenes-red]
        include:
          - suite: fixture-loader
            testClass: com.almishkat.studio.FixtureLoaderVersionTest
          - suite: baseline-d01-red
            testClass: com.almishkat.studio.D01HistoricalRedEvidenceTest
          - suite: v1-v10-upgrade
            testClass: com.almishkat.studio.V1V10SchemaMatrixTest
          - suite: scenes-red
            testClass: com.almishkat.studio.StudioScenesHistoricalRedTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run isolated fixture and migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-m1-tst-01-unified.sh ${{ matrix.testClass }} ${{ matrix.suite }}
      - name: Upload JUnit XML and logs on success and failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adm-m1-037-api-${{ matrix.api }}-${{ matrix.suite }}
          if-no-files-found: warn
          path: |
            m1-tst-01-unified-output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
