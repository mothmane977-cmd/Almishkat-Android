
name: Almishkat Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Editor V3
        run: unzip -q Almishkat-Editor-v3.zip

      - name: Verify project
        run: |
          test -f Almishkat-Android/settings.gradle.kts
          test -f Almishkat-Android/app/build.gradle.kts
          test -f Almishkat-Android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: Almishkat-Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-Editor-v3-APK
          path: Almishkat-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
