# ADM-M1-063: TEMPORARY, non-required evidence workflow; remove after API26/API36 JUnit verification.
name: ADM-M1-063 Fixture Loader temporary evidence
on:
  push:
    branches:
      - test/M1-TST-01-historical-schema-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-loader:
    if: github.ref == 'refs/heads/test/M1-TST-01-historical-schema-audit'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - name: Checkout exact fixture PR head
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API fixture loader JUnit (10 cases)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c 'mkdir -p adm-m1-063-evidence;
            adb shell getprop ro.build.version.sdk > adm-m1-063-evidence/device-api.txt;
            adb shell getprop ro.build.fingerprint > adm-m1-063-evidence/device-fingerprint.txt;
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.almishkat.studio.FixtureLoaderVersionTest --no-daemon --stacktrace > adm-m1-063-evidence/gradle-connected.log 2>&1;
            rc=$?;
            printf "HEAD_SHA=%s\\nGRADLE_EXIT=%s\\nTEST_CLASS=FixtureLoaderVersionTest\\n" "$GITHUB_SHA" "$rc" > adm-m1-063-evidence/status.txt;
            echo "Fixture loader Gradle exit: $rc";
            exit "$rc"'
      - name: Preserve JUnit XML and Gradle diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adm-m1-063-fixture-loader-api-${{ matrix.api }}
          if-no-files-found: warn
          path: |
            adm-m1-063-evidence/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
