name: Almishkat V23 Integration Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract V23
        run: unzip -q Almishkat-V23-Integration-01.zip

      - name: Fix Gradle properties
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          s = p.read_text(encoding="utf-8")
          s = s.replace("\\n", "\n")
          p.write_text(s, encoding="utf-8")
          print("Gradle properties fixed")
          PY

      - name: Fix Android settings
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          cat > settings.gradle.kts <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmishkatStudio"
          include(":app")
          KOTLIN

      - name: Repair malformed Kotlin files
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path("app/src/main/java")
          repaired = []

          for p in root.rglob("*.kt"):
              lines = p.read_text(encoding="utf-8").splitlines()
              first = next(
                  (i for i, line in enumerate(lines) if line.strip()),
                  None
              )

              if first is not None and lines[first].strip() == "\\":
                  del lines[first]
                  source = textwrap.dedent("\n".join(lines)).lstrip()
                  p.write_text(source + "\n", encoding="utf-8")
                  repaired.append(str(p))

          print("Repaired:", repaired)

          if len(repaired) != 6:
              raise SystemExit(
                  f"Expected 6 malformed files, found {len(repaired)}"
              )
          PY

      - name: Fix exact Compose imports
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/almishkat/studio")

          additions = {
              "MainActivity.kt": [
                  "import androidx.compose.material.icons.rounded.Book",
                  "import androidx.compose.material.icons.rounded.Movie",
                  "import androidx.compose.material.icons.rounded.Layers",
              ],
              "StudioProjectsScreen.kt": [
                  "import androidx.compose.foundation.clickable",
              ],
          }

          for filename, imports in additions.items():
              p = root / filename

              if not p.exists():
                  raise SystemExit(f"Missing file: {p}")

              source = p.read_text(encoding="utf-8")

              for item in imports:
                  if item not in source:
                      match = re.search(
                          r'(?m)^package\s+[^\n]+',
                          source
                      )

                      if not match:
                          raise SystemExit(
                              f"Package declaration missing: {filename}"
                          )

                      pos = match.end()
                      source = (
                          source[:pos] + "\n\n" + item + source[pos:]
                      )

              p.write_text(source, encoding="utf-8")
              print("Fixed imports:", filename)

          main = (root / "MainActivity.kt").read_text(encoding="utf-8")

          for name in ("Book", "Movie", "Layers"):
              if f"Icons.Rounded.{name}" not in main:
                  raise SystemExit(
                      f"Expected Icons.Rounded.{name} usage not found"
                  )

          build = Path("app/build.gradle.kts").read_text(
              encoding="utf-8"
          )

          if "material-icons-extended" not in build:
              raise SystemExit(
                  "Original material-icons-extended dependency missing"
              )

          print("Compose icons dependency verified")
          PY

      - name: Verify project
        run: |
          test -f Almishkat_Android_PhoneBuild/settings.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/build.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/src/main/AndroidManifest.xml

          echo "V23 structure verified"

      - name: Build Almishkat APK
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully"

      - name: Upload Almishkat APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-V23-Integration-01-APK
          path: Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
