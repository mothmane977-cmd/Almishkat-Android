name: Almishkat Current Source - Clean Clone Build

on:
  push:
    branches:
      - feature/M0-FOUND-01-structure
    paths:
      - "app/**"
      - "core/**"
      - "data/**"
      - "domain/**"
      - "ui/**"
      - "scripts/**"
      - "docs/**"
      - "archive/**"
      - "README.md"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-current-source.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almishkat-current-build
  cancel-in-progress: true

jobs:
  build:
    name: Clean Clone Verification and APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: clean-source
          clean: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK: $SDK_ROOT"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import subprocess

          command = [
              os.environ["SDKMANAGER"],
              f'--sdk_root={os.environ["SDK_ROOT"]}',
              "--licenses"
          ]

          result = subprocess.run(
              command,
              input="y\n" * 200,
              text=True,
              check=False
          )

          if result.returncode != 0:
              raise SystemExit("SDK license acceptance failed.")

          print("Android SDK licenses accepted.")
          PY

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify clean checkout
        working-directory: clean-source
        shell: bash
        run: |
          set -e

          echo "Expected commit: $GITHUB_SHA"
          echo "Actual commit: $(git rev-parse HEAD)"

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Checkout is not clean."
            git status --short
            exit 1
          fi

          echo "Clean checkout verified."

      - name: Verify project structure
        working-directory: clean-source
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          required = [
              "settings.gradle.kts",
              "build.gradle.kts",
              "gradle.properties",
              "app/build.gradle.kts",
              "app/src/main/AndroidManifest.xml",
              "README.md"
          ]

          for name in required:
              if not (root / name).is_file():
                  raise SystemExit(f"Missing required file: {name}")
              print(f"OK: {name}")

          folders = [
              "app",
              "core",
              "data",
              "domain",
              "ui",
              "scripts",
              "docs",
              "archive"
          ]

          for name in folders:
              if not (root / name).is_dir():
                  raise SystemExit(f"Missing directory: {name}")
              print(f"OK: {name}/")

          excluded = {".git", ".gradle", "build", "archive"}

          settings_files = [
              p.relative_to(root)
              for p in root.rglob("settings.gradle.kts")
              if not any(part in excluded for part in p.parts)
          ]

          if settings_files != [Path("settings.gradle.kts")]:
              raise SystemExit(
                  f"Unexpected project nesting: {settings_files}"
              )

          app_gradle_files = [
              p.relative_to(root)
              for p in root.rglob("app/build.gradle.kts")
              if not any(part in excluded for part in p.parts)
          ]

          if app_gradle_files != [Path("app/build.gradle.kts")]:
              raise SystemExit(
                  f"Unexpected app module: {app_gradle_files}"
              )

          print("No nested Android project detected.")
          print("Project structure verification passed.")
          PY

      - name: Verify build environment
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          adb version

          "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --list_installed

      - name: Build Debug APK
        working-directory: clean-source
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify generated APK
        working-directory: clean-source
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK successfully generated."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-Clean-Clone-Debug-APK
          path: clean-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "ALMISHKAT CLEAN CLONE BUILD"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "JDK: 17"
          echo "Gradle: 8.11.1"
          echo "Android SDK: 36"
          echo "Build source: clean-source/"
