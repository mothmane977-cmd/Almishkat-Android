name: Almishkat V23 SQLite Fix Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract SQLite Fix
        run: |
          unzip -q Almishkat-V23-SQLite-Fix.zip

      - name: Set project directory
        run: |
          test -d Almishkat_Android_PhoneBuild
          echo "PROJECT_DIR=Almishkat_Android_PhoneBuild" >> "$GITHUB_ENV"

      - name: Fix Gradle properties
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          s = p.read_text(encoding="utf-8")
          s = s.replace("\\n", "\n")
          p.write_text(s, encoding="utf-8")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Fix Android settings
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          cat > settings.gradle.kts <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmishkatStudio"
          include(":app")
          KOTLIN

      - name: Repair malformed Kotlin files
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path("app/src/main/java")
          repaired = []

          for p in root.rglob("*.kt"):
              lines = p.read_text(encoding="utf-8").splitlines()

              first = next(
                  (i for i, line in enumerate(lines) if line.strip()),
                  None
              )

              if first is not None and lines[first].strip() == "\\":
                  del lines[first]
                  source = textwrap.dedent("\n".join(lines)).lstrip()
                  p.write_text(source + "\n", encoding="utf-8")
                  repaired.append(str(p))

          print("Repaired files:", repaired)

          if len(repaired) != 6:
              raise SystemExit(
                  f"Expected 6 malformed files, found {len(repaired)}"
              )
          PY

      - name: Fix Compose imports
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/almishkat/studio")

          additions = {
              "MainActivity.kt": [
                  "import androidx.compose.material.icons.rounded.Book",
                  "import androidx.compose.material.icons.rounded.Movie",
                  "import androidx.compose.material.icons.rounded.Layers",
              ],
              "StudioProjectsScreen.kt": [
                  "import androidx.compose.foundation.clickable",
              ],
          }

          for filename, imports in additions.items():
              p = root / filename

              if not p.exists():
                  raise SystemExit(f"Missing file: {p}")

              source = p.read_text(encoding="utf-8")

              for item in imports:
                  if item not in source:
                      match = re.search(
                          r'(?m)^package\s+[^\n]+',
                          source
                      )

                      if not match:
                          raise SystemExit(
                              f"Package declaration missing: {filename}"
                          )

                      pos = match.end()
                      source = source[:pos] + "\n\n" + item + source[pos:]

              p.write_text(source, encoding="utf-8")
              print("Imports fixed:", filename)

          PY

      - name: Fix SQLite database creation
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/almishkat/studio/"
              "QuranLocalDatabase.kt"
          )

          source = p.read_text(encoding="utf-8")

          start = source.find("override fun onCreate")
          end = source.find("override fun onUpgrade", start)

          if start < 0 or end < 0:
              raise SystemExit("Database lifecycle methods not found")

          before = source[:start]
          on_create = source[start:end]
          after = source[end:]

          lines = on_create.splitlines()
          fixed = []

          for line in lines:
              if (
                  "ALTER TABLE scene_layers ADD COLUMN scene_id TEXT"
                  in line
              ):
                  continue

              if (
                  "ALTER TABLE scene_backgrounds ADD COLUMN scene_id TEXT"
                  in line
              ):
                  continue

              fixed.append(line)

          source = before + "\n".join(fixed) + "\n" + after

          p.write_text(source, encoding="utf-8")

          # Ensure migrations remain in onUpgrade.
          upgrade = source[source.find("override fun onUpgrade"):]

          if "ALTER TABLE scene_layers ADD COLUMN scene_id TEXT" not in upgrade:
              raise SystemExit("scene_layers migration missing")

          if "ALTER TABLE scene_backgrounds ADD COLUMN scene_id TEXT" not in upgrade:
              raise SystemExit("scene_backgrounds migration missing")

          print("SQLite creation and migration verified")
          PY

      - name: Verify Quran dataset query
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/almishkat/studio/"
              "QuranLocalDatabase.kt"
          )

          s = p.read_text(encoding="utf-8")

          required = [
              "fun getDatasetStatus",
              "SELECT source_name, source_version, ayah_count",
              "WHERE riwayah = ?"
          ]

          for item in required:
              if item not in s:
                  raise SystemExit("Missing SQL fix: " + item)

          print("Quran dataset query verified")
          PY

      - name: Verify project structure
        run: |
          test -f Almishkat_Android_PhoneBuild/settings.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/build.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/src/main/AndroidManifest.xml
          test -f Almishkat_Android_PhoneBuild/app/src/main/java/com/almishkat/studio/QuranLocalDatabase.kt

          echo "Project structure verified"

      - name: Build Almishkat APK
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          echo "APK generated successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-V23-SQLite-Fix-APK
          path: Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
