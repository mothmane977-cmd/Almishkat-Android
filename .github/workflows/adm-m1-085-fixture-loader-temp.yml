# ADM-M1-085: TEMPORARY evidence-only workflow; remove after verified API 26/36 JUnit.
name: ADM-M1-085 Temporary FixtureLoader Evidence
on:
  push:
    branches:
      - test/M1-TST-01-historical-schema-audit

permissions:
  contents: read

jobs:
  fixture-loader:
    if: github.ref == 'refs/heads/test/M1-TST-01-historical-schema-audit'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run exactly ten Loader cases on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c 'mkdir -p adm-m1-085-evidence;
            adb shell getprop ro.build.version.sdk > adm-m1-085-evidence/device-api.txt;
            adb shell getprop ro.build.fingerprint > adm-m1-085-evidence/device-fingerprint.txt;
            start=$(date +%s);
            date -u +%Y-%m-%dT%H:%M:%SZ > adm-m1-085-evidence/start-utc.txt;
            gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.almishkat.studio.FixtureLoaderVersionTest --no-daemon --stacktrace > adm-m1-085-evidence/gradle-connected.log 2>&1;
            rc=$?;
            end=$(date +%s);
            date -u +%Y-%m-%dT%H:%M:%SZ > adm-m1-085-evidence/end-utc.txt;
            printf "HEAD_SHA=%s\\nGRADLE_EXIT=%s\\nELAPSED_SECONDS=%s\\nTEST_CLASS=FixtureLoaderVersionTest\\n" "$GITHUB_SHA" "$rc" "$((end-start))" > adm-m1-085-evidence/status.txt;
            echo "Gradle exit: $rc, elapsed: $((end-start)) seconds";
            exit "$rc"'
      - name: Validate genuine JUnit XML exactly 10 cases, fail closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p adm-m1-085-evidence
          python3 - <<'PY'
          import glob,json,sys,xml.etree.ElementTree as ET
          from collections import Counter
          paths=glob.glob("app/build/outputs/androidTest-results/**/*.xml",recursive=True)
          entries=[]
          errors=[]
          for path in sorted(paths):
              try:
                  root=ET.parse(path).getroot()
                  for case in root.iter("testcase"):
                      klass=(case.get("classname") or "").rsplit(".",1)[-1]
                      if klass!="FixtureLoaderVersionTest":
                          continue
                      status=("FAIL" if case.find("failure") is not None else
                              "ERROR" if case.find("error") is not None else
                              "SKIP" if case.find("skipped") is not None else "PASS")
                      entries.append({"class":klass,"name":case.get("name"),"status":status,"xml":path})
              except Exception as e:
                  errors.append({"path":path,"error":str(e)})
          counts=Counter(e["status"] for e in entries)
          result={"junit_xml_files":sorted(paths),"counts":{s:counts.get(s,0) for s in ("PASS","FAIL","ERROR","SKIP")},"cases":entries,"xml_errors":errors}
          with open("adm-m1-085-evidence/junit-summary.json","w") as f: json.dump(result,f,indent=2)
          print(json.dumps({"counts":result["counts"],"xml_errors":errors,"files":len(paths)}))
          if errors or len(entries)!=10 or counts.get("PASS",0)!=10 or any(counts.get(k,0) for k in ("FAIL","ERROR","SKIP")):
              sys.exit(1)
          PY
          test "$(sed -n 's/^GRADLE_EXIT=//p' adm-m1-085-evidence/status.txt)" = 0
          test "$(sed -n 's/^HEAD_SHA=//p' adm-m1-085-evidence/status.txt)" = "$GITHUB_SHA"
      - name: Upload JUnit XML and Gradle logs, including failed cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adm-m1-085-api-${{ matrix.api }}-run-${{ github.run_id }}
          if-no-files-found: error
          path: |
            adm-m1-085-evidence/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
