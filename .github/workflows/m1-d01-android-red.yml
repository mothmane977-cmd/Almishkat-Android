# ADM-M1-012 / M1-FIX-01. Test-only branch; RED results are expected.
name: M1 D01 Historical RED evidence (baseline only)

on:
  push:
    branches:
      - test/M1-FIX-01-android-red
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d01-red:
    if: github.ref == 'refs/heads/test/M1-FIX-01-android-red'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - name: Checkout independent test branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu SDK + emulator-runner manage SDK; avoid legacy 'tools' package install.
      - name: Gradle 8.14.3 (no gradlew on develop)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run original SQLiteOpenHelper instrumentation (expected RED)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-d01-red.sh
      - name: Upload logs and JUnit reports even on RED/BLOCKED
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adm-m1-012-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            adm-m1-012-output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            app/build/reports/tests/**
