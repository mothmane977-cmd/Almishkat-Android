# ADM-M1-031: evidence-only isolated integration branch, NOT a required CI gate.
# This branch contains both independently proposed fixes only to exercise dependent
# historical versions; merge candidates remain separated (scene fix on develop base).
name: M1 Scenes 031 GREEN evidence (non-gating)

on:
  push:
    branches:
      - feature/M1-TST-01-scenes-green-ADM-M1-031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenes-green-evidence:
    if: github.ref == 'refs/heads/feature/M1-TST-01-scenes-green-ADM-M1-031'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
        suite: [scenes-green, structural-matrix, d01-regression]
        include:
          - suite: scenes-green
            testClass: com.almishkat.studio.StudioScenesHistoricalRedTest
          - suite: structural-matrix
            testClass: com.almishkat.studio.V1V10SchemaMatrixTest
          - suite: d01-regression
            testClass: com.almishkat.studio.D01MigrationInstrumentedTest
    steps:
      - name: Checkout review-only integration tests
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.14.3 (no gradlew in repository)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android SQLiteOpenHelper GREEN acceptance evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-scenes-red.sh ${{ matrix.testClass }} ${{ matrix.suite }}
      - name: Save individual JUnit XML and logs on PASS or FAIL
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adm-m1-031-api-${{ matrix.api }}-${{ matrix.suite }}
          if-no-files-found: warn
          path: |
            adm-m1-028-output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
