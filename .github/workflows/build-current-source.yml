
name: Almishkat Current Source - Build APK

on:
  push:
    branches:
      - feature/M0-FOUND-01-structure
    paths:
      - "app/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-current-source.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: almishkat-current-build
  cancel-in-progress: true

jobs:
  build:
    name: Build V25 Current Source
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          adb version
          sdkmanager --list_installed

      - name: Verify project configuration
        run: |
          set -e

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Project configuration files found."

      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-Current-Source-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "Almishkat current-source build finished."
          echo "Branch: feature/M0-FOUND-01-structure"
          echo "Gradle: 8.11.1"
          echo "JDK: 17"
          echo "Android SDK: 36"
          
