# Temporary M1 evidence for PR #23; not a new permanent M2 device gate.
# Remove after API 26 / API 36 evidence has been recorded against the tested SHA.
name: M1 database device validation (temporary)

on:
  push:
    branches:
      - fix/M1-db-upgrade-background-regressions
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/m1-database-device-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-database-device-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-device-tests:
    if: github.ref == 'refs/heads/fix/M1-db-upgrade-background-regressions'
    name: Database instrumentation API ${{ matrix.api }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    env:
      EXPECTED_API: ${{ matrix.api }}
      EXPECTED_TESTS: '19'
      TEST_CLASS: com.almishkat.studio.DatabaseInstrumentedRegressionTest
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare evidence and device test script
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p m1-device-evidence
          printf 'HEAD_SHA=%s\nEXPECTED_API=%s\nSTATUS=NOT_RUN\n' \
            "$GITHUB_SHA" "$EXPECTED_API" > m1-device-evidence/status.txt
          cat > m1-device-evidence/run-device-tests.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          collect_evidence() {
            result=$?
            trap - EXIT
            adb devices -l > m1-device-evidence/adb-devices.txt 2>&1 || true
            adb logcat -d -v threadtime > m1-device-evidence/logcat.txt 2>&1 || true
            adb shell getprop > m1-device-evidence/device-properties.txt 2>&1 || true
            if [ "$result" -ne 0 ]; then
              adb exec-out screencap -p > m1-device-evidence/failure-screen.png 2>m1-device-evidence/screenshot-error.txt || true
            fi
            printf 'HEAD_SHA=%s\nEXPECTED_API=%s\nTEST_CLASS=%s\nSCRIPT_EXIT=%s\n' \
              "$GITHUB_SHA" "$EXPECTED_API" "$TEST_CLASS" "$result" > m1-device-evidence/status.txt
            exit "$result"
          }
          trap collect_evidence EXIT
          adb wait-for-device
          actual_api="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$actual_api" = "$EXPECTED_API"
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell pm path android > m1-device-evidence/package-manager-ready.txt
          adb shell getprop ro.build.fingerprint > m1-device-evidence/device-fingerprint.txt
          printf '%s\n' "$actual_api" > m1-device-evidence/device-api.txt
          # Some API 26 images refuse log-buffer clearing; diagnostics must not
          # prevent the strict instrumentation command and JUnit checks below.
          adb logcat -c || true
          gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class="$TEST_CLASS" \
            2>&1 | tee m1-device-evidence/gradle-connected.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No instrumentation JUnit XML: device coverage NOT PROVEN")
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, "0"))
          summary = " ".join(f"{key}={value}" for key, value in totals.items())
          Path("m1-device-evidence/junit-summary.txt").write_text(summary + "\n")
          print(summary)
          if totals["tests"] != int(os.environ["EXPECTED_TESTS"]):
              raise SystemExit("Unexpected instrumentation count; no partial or empty suite acceptance")
          if any(totals[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("Instrumentation failure/error/skip: NOT PASS")
          PY
          SH

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev rules apply asynchronously; wait before checking the device.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run database regressions on booted Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash m1-device-evidence/run-device-tests.sh

      - name: Collect runner diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p m1-device-evidence
          uname -a > m1-device-evidence/runner-kernel.txt
          adb version > m1-device-evidence/adb-version.txt 2>&1 || true
          adb devices -l > m1-device-evidence/final-adb-devices.txt 2>&1 || true
          ls -l /dev/kvm > m1-device-evidence/kvm.txt 2>&1 || true

      - name: Preserve JUnit and device diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-database-device-api-${{ matrix.api }}
          path: |
            m1-device-evidence/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: error
          retention-days: 14
