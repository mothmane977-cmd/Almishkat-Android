# M1-CI-01 PREPARATION ONLY: not a required branch-protection check.
# Dependency gate M1-TST-01 must be accepted first.
name: M1 candidate db-tests v1-v10 (not required)

on:
  push:
    branches:
      - feature/M1-TST-01-v1-v10-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-tests:
    if: github.ref == 'refs/heads/feature/M1-TST-01-v1-v10-matrix'
    name: db-tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise reconstructed v1-v10 matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-db-matrix.sh
      - name: Persist JUnit XML and logs even if failures are detected
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-tst-01-db-tests-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            m1-tst-01-output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
