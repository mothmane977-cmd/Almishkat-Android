
name: Almishkat V23 Integration Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract V23 Integration
        run: unzip -q Almishkat-V23-Integration-01.zip

      - name: Fix Gradle properties
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")
          s = p.read_text(encoding="utf-8")
          s = s.replace("\\n", "\n")
          p.write_text(s, encoding="utf-8")
          print("Gradle properties fixed")
          PY

      - name: Fix Android settings
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          cat > settings.gradle.kts <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmishkatStudio"
          include(":app")
          KOTLIN

          echo "Android settings fixed"

      - name: Verify project
        run: |
          test -f Almishkat_Android_PhoneBuild/settings.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/build.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/src/main/AndroidManifest.xml
          echo "V23 project verified"

      - name: Build Almishkat APK
        working-directory: Almishkat_Android_PhoneBuild
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload Almishkat APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-V23-Integration-01-APK
          path: Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
