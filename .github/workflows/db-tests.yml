# ADM-M1-040: GREEN comparison TRIAL only; not a required status check.
# Enable branch protection only after fixture acceptance, successful Android CI and owner authorization.
name: db-tests

on:
  push:
    branches:
      - 'feature/M1-CI-01-green-trial-ADM-M1-040*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-db-tests:
    if: startsWith(github.ref, 'refs/heads/feature/M1-CI-01-green-trial-ADM-M1-040')
    name: android-db-tests (API ${{ matrix.api }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - name: Checkout tested D01 + scenes integration base and M1-TST-01 fixture loader
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.14.3 (no project wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android DB acceptance (excludes Historical RED)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/run-m1-ci-01-db-tests.sh
      - name: Publish original JUnit XML, diagnostics, timing even when RED
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adm-m1-040-${{ github.ref_name }}-api-${{ matrix.api }}
          if-no-files-found: warn
          path: |
            m1-ci-01-output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**

  db-tests:
    name: db-tests
    if: always() && startsWith(github.ref, 'refs/heads/feature/M1-CI-01-green-trial-ADM-M1-040')
    needs: [android-db-tests]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require both Android API 26 and 36 (no failure masking)
        env:
          MATRIX_RESULT: ${{ needs['android-db-tests'].result }}
        run: |
          echo "android-db-tests matrix result: $MATRIX_RESULT"
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::At least one required Android DB acceptance lane failed or was cancelled."
            exit 1
          fi
          echo "Both Android DB acceptance lanes passed."
