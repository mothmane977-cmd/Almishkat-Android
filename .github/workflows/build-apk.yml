
name: Almishkat V24 Export Button Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract V24 source
        run: |
          unzip -q Almishkat-V24-Export-Button-Source.zip

      - name: Fix Gradle properties
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("gradle.properties")

          if not p.exists():
              raise SystemExit("gradle.properties not found")

          s = p.read_text(encoding="utf-8")
          s = s.replace("\\n", "\n")
          p.write_text(s, encoding="utf-8")

          print("Gradle properties repaired:")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Fix Android settings
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          cat > settings.gradle.kts <<'KOTLIN'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AlmishkatStudio"
          include(":app")
          KOTLIN

      - name: Verify V24 project files
        run: |
          test -f Almishkat_Android_PhoneBuild/settings.gradle.kts
          test -f Almishkat_Android_PhoneBuild/build.gradle.kts
          test -f Almishkat_Android_PhoneBuild/gradle.properties
          test -f Almishkat_Android_PhoneBuild/app/build.gradle.kts
          test -f Almishkat_Android_PhoneBuild/app/src/main/AndroidManifest.xml

          test -f Almishkat_Android_PhoneBuild/app/src/main/java/com/almishkat/studio/MainActivity.kt

          test -f Almishkat_Android_PhoneBuild/app/src/main/java/com/almishkat/studio/VideoExportScreen.kt

          test -f Almishkat_Android_PhoneBuild/app/src/main/java/com/almishkat/studio/VideoExportEngine.kt

          test -f Almishkat_Android_PhoneBuild/app/src/main/java/com/almishkat/studio/VideoExportModels.kt

          echo "All V24 export files verified"

      - name: Verify export entry
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java/com/almishkat/studio")

          main = (root / "MainActivity.kt").read_text(encoding="utf-8")
          screen = (root / "VideoExportScreen.kt").read_text(encoding="utf-8")
          engine = (root / "VideoExportEngine.kt").read_text(encoding="utf-8")

          if "VideoExportScreen" not in main:
              raise SystemExit(
                  "VideoExportScreen is not referenced in MainActivity"
              )

          if "VideoExportEngine" not in screen:
              raise SystemExit(
                  "Export screen does not reference the export engine"
              )

          if len(engine.strip()) < 1000:
              raise SystemExit("Video export engine appears incomplete")

          print("V24 export integration checks passed")
          PY

      - name: Build Almishkat APK
        working-directory: Almishkat_Android_PhoneBuild
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -s Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk

          echo "APK generated successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Almishkat-V24-Export-Button-APK
          path: Almishkat_Android_PhoneBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
